name: dashboard-homelab

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: ${DASHBOARD_IMAGE_PREFIX:-dashboard-homelab}/migrate:${APP_VERSION:-0.1.0}
    restart: "no"
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dashboard}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: ${DASHBOARD_IMAGE_PREFIX:-dashboard-homelab}/web:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_URL: ${APP_URL:?APP_URL is required}
      NEXTAUTH_URL: ${APP_URL:?APP_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY is required}
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dashboard}
      REDIS_URL: redis://redis:6379
      REALTIME_URL: http://realtime:3002
      WORKER_URL: http://worker:3001
      BACKUP_DIR: /appdata/backups
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - appdata:/appdata
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 25s
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: ${DASHBOARD_IMAGE_PREFIX:-dashboard-homelab}/worker:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dashboard}
      REDIS_URL: redis://redis:6379
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
      target: realtime
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    image: ${DASHBOARD_IMAGE_PREFIX:-dashboard-homelab}/realtime:${APP_VERSION:-0.1.0}
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-0.1.0}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      APP_URL: ${APP_URL:?APP_URL is required}
      REDIS_URL: redis://redis:6379
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: "3002"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 15s
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  appdata:
