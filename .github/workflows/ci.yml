name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard
          POSTGRES_DB: dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dashboard -d dashboard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://dashboard:dashboard@localhost:5432/dashboard_test
      AUTH_SECRET: phase-3-ci-secret-value-at-least-32-characters
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Pin pnpm
        run: corepack prepare pnpm@11.23.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate database migrations
        run: pnpm --filter @dashboard/db db:check:sqlite && pnpm --filter @dashboard/db db:check:postgres

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm --filter @dashboard/db test:postgres

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Frontend quality budgets
        run: pnpm test:lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          if-no-files-found: ignore

      - name: Validate Compose
        env:
          APP_URL: http://127.0.0.1:3000
          AUTH_SECRET: phase-3-ci-secret-value-at-least-32-characters
          SECRET_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          POSTGRES_PASSWORD: ci-compose-password
        run: docker compose -f compose.yaml config --quiet

  containers:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build production images (linux/amd64)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: web,worker,realtime,migrate
          load: true
          set: |
            *.platform=linux/amd64
            *.args.APP_VERSION=1.0.0

      - name: Production smoke
        env:
          SKIP_BUILD: "1"
          APP_VERSION: "1.0.0"
        run: node scripts/production-smoke.mjs
