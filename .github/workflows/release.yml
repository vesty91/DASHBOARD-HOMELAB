name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tags
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR="${TAG%%.*}"
          MINOR="${TAG%.*}"
          SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write bake tag override
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_MINOR: ${{ steps.version.outputs.minor }}
          RELEASE_MAJOR: ${{ steps.version.outputs.major }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
          RELEASE_STABLE: ${{ steps.version.outputs.stable }}
        run: node scripts/write-release-bake.mjs > docker-bake.release.hcl

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch images
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            docker-bake.hcl
            docker-bake.release.hcl
          targets: web,worker,realtime,migrate
          push: true
          sbom: true
          provenance: true
          set: |
            *.platform=linux/amd64,linux/arm64
            *.args.APP_VERSION=${{ steps.version.outputs.tag }}
