name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR="${TAG%%.*}"
          MINOR="${TAG%.*}"
          SHA="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch images
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: web,worker,realtime,migrate
          push: true
          sbom: true
          provenance: true
          set: |
            *.platform=linux/amd64,linux/arm64
            *.args.APP_VERSION=${{ steps.version.outputs.tag }}
            web.tags=ghcr.io/vesty91/dashboard-homelab/web:${{ steps.version.outputs.tag }},ghcr.io/vesty91/dashboard-homelab/web:${{ steps.version.outputs.minor }},ghcr.io/vesty91/dashboard-homelab/web:${{ steps.version.outputs.major }},ghcr.io/vesty91/dashboard-homelab/web:sha-${{ steps.version.outputs.sha }},ghcr.io/vesty91/dashboard-homelab/web:latest
            worker.tags=ghcr.io/vesty91/dashboard-homelab/worker:${{ steps.version.outputs.tag }},ghcr.io/vesty91/dashboard-homelab/worker:${{ steps.version.outputs.minor }},ghcr.io/vesty91/dashboard-homelab/worker:${{ steps.version.outputs.major }},ghcr.io/vesty91/dashboard-homelab/worker:sha-${{ steps.version.outputs.sha }},ghcr.io/vesty91/dashboard-homelab/worker:latest
            realtime.tags=ghcr.io/vesty91/dashboard-homelab/realtime:${{ steps.version.outputs.tag }},ghcr.io/vesty91/dashboard-homelab/realtime:${{ steps.version.outputs.minor }},ghcr.io/vesty91/dashboard-homelab/realtime:${{ steps.version.outputs.major }},ghcr.io/vesty91/dashboard-homelab/realtime:sha-${{ steps.version.outputs.sha }},ghcr.io/vesty91/dashboard-homelab/realtime:latest
            migrate.tags=ghcr.io/vesty91/dashboard-homelab/migrate:${{ steps.version.outputs.tag }},ghcr.io/vesty91/dashboard-homelab/migrate:${{ steps.version.outputs.minor }},ghcr.io/vesty91/dashboard-homelab/migrate:${{ steps.version.outputs.major }},ghcr.io/vesty91/dashboard-homelab/migrate:sha-${{ steps.version.outputs.sha }},ghcr.io/vesty91/dashboard-homelab/migrate:latest
