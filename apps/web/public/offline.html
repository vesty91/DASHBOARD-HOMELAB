<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101318" />
    <title>Hors ligne — Homelab Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #101318;
        --surface: #171c24;
        --border: #2b3443;
        --foreground: #f3f5f8;
        --muted-foreground: #97a3b6;
        --accent: #4f7dff;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      main {
        width: min(28rem, 100%);
        padding: 1.75rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.25rem;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .mark {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        width: 1.7rem;
        height: 1.7rem;
        padding: 3px;
        border-radius: 7px;
        background: rgb(79 125 255 / 0.16);
        flex: none;
      }
      .mark span {
        display: block;
        border-radius: 2px;
        background: var(--accent);
      }
      .mark span:nth-child(2) {
        opacity: 0.55;
      }
      .mark span:nth-child(3) {
        opacity: 0.7;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted-foreground);
      }
      button {
        margin-top: 1.25rem;
        padding: 0.55rem 1rem;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #071433;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </span>
        Homelab
      </div>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Homelab Dashboard n’est pas disponible sans connexion. Aucune donnée privée n’est conservée
        hors ligne. Réessayez lorsque le réseau revient.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
